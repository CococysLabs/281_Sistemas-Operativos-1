customRules:
  fortress-tuning.yaml: |-
    - rule: Read from /etc/tmp in container
      desc: A process read a file below /etc/tmp from inside a container.
      condition: >
        open_read
        and container
        and fd.name startswith /etc/tmp
      output: >
        CRITICAL ALERT: Read from /etc/tmp in container
        (user=%user.name pod=%k8s.pod.name namespace=%k8s.ns.name
        container=%container.name file=%fd.name command=%proc.cmdline)
      priority: CRITICAL
      tags: [container, filesystem, mitre_discovery]
